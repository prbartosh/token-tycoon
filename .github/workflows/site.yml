name: site

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: prbartosh/token-tycoon-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          path: releases
      - name: Sync site
        run: |
          rsync -a --delete site/ releases/site/
          cd releases
          git add -A site
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync site from token-tycoon@${GITHUB_SHA::7}"
          git push
