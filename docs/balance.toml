# Token Tycoon: stałe balansu
# Wartości startowe (hipotezy). Strojenie wyłącznie przez symulator: token-tycoon --simulate
# Plik jest wbudowany w binarkę; lokalna kopia w katalogu konfiguracyjnym nadpisuje wybrane klucze.

[meta]
version = 1
target_days = 30

# ---------------------------------------------------------------- symulacja i wydajność
[engine]
sim_step_ms = 100
fps_animation = 30
fps_normal = 10
fps_background = 1
offline_step_s = 60
autosave_s = 60
backups = 3
undo_window_s = 5

[offline]
efficiency_start = 0.5
efficiency_max = 1.0
cap_hours_start = 8
cap_hours_max = 24

# ---------------------------------------------------------------- biznesy
# cost: koszt bazowy, r: mnożnik kosztu, cycle_s: czas cyklu, tokens: tokeny na cykl,
# compute: zużycie compute na sztukę, manager_mult: koszt menedżera = cost × manager_mult

[business_defaults]
manager_mult = 100
continuous_bar_below_s = 0.2

[[business]]
id = "api_wrapper"
name = "Wrapper na API"
cost = 10
r = 1.07
cycle_s = 1
tokens = 1
compute = 0.01

