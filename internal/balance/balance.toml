# ---------------------------------------------------------------- dopamine
# Expected crit multiplier per cycle = 1 + chance * (mult - 1) = 1.27, independent of the
# cycle length, so the average crit contribution is the same for every business
# (DECISIONS item 14). Offline and above draw_cap_per_s the expected value is used.
[crit]
chance = 0.03
mult = 10

# DECISIONS item 16: every Space press adds `step` to a global revenue multiplier that starts
# at 1.0, capped at max_mult, and resets to 1.0 after decay_after_s seconds without a press.
[combo]
max_mult = 5.0
step = 0.1
decay_after_s = 2

[streak]
max_day = 7
bonus_per_day_minutes = 10     # grant = streak day * 10 minutes of revenue
break_penalty = 1              # streak drop on a missed day

[events]
unlock_lifetime = 1e7          # day-1 system, opens with infrastructure (see header)
interval_s = [120, 300]

