free_businesses = { api_wrapper = 1 }

# ---------------------------------------------------------------- businesses
# cost: base cost, r: cost growth, cycle_s: cycle length, tokens: tokens per cycle per unit,
# compute: compute per unit, manager cost = cost * manager_mult unless manager_cost is set.
# unlock_lifetime: lifetime revenue needed before the business can be bought (see header).

[business_defaults]
manager_mult = 100
continuous_bar_below_s = 0.2
# DECISIONS item 14: in continuous mode crits and card drops are rolled for at most this many
# cycles per second per business; the surplus is credited at expected value without rolls.
draw_cap_per_s = 5

