# Token Tycoon: balance constants
#
# Starting values are hypotheses. Tune only through the simulator: token-tycoon --simulate
# This file is embedded in the binary. A local copy at ~/.config/token-tycoon/balance.toml
# overrides only the keys it contains (arrays of tables are merged by their "id"/"gen" key).
#
# Display names of businesses, upgrades, cards, events, rivals, regions, rounds etc. are NOT
# here: they live in the translation catalogs (internal/i18n), keyed by the ids below.
#
# ------------------------------------------------------------------------------------------
# UNLOCK THRESHOLDS (docs/DECISIONS.md item 8)
#
# Every former `unlock_day = d` is replaced by `unlock_lifetime = X`, a threshold on
# lifetime total revenue in $ (state.lifetime.total). X is derived from the pacing table in
# DESIGN section 10, which gives the income range R_lo(d)..R_hi(d) in $/s for each day:
#
#   X(d) = 10 ^ round( log10( R_lo(d) * 3600 ) )
#
# i.e. "one hour of income at the rate the player has when day d starts", rounded to the
# nearest power of ten. Under roughly exponential growth, cumulative revenue at a given
# moment is income/growth_rate; one hour is the e-folding time of an active session, so the
# threshold is crossed close to the start of day d.
#
#   day  R_lo $/s   R_lo*3600   X        used for
#   2    1e9        3.6e12      1e13     market, rivals, segments
#   3    1e13       3.6e16      1e17     training, data, businesses 7..10
#   4    1e18       3.6e21      1e22     contracts, talent
#   5    1e25       3.6e28      1e29     investors (funding round itself: layer2 1e40, kept)
#   8    1e40       3.6e43      1e44     rules (automation)
#   10   1e50       3.6e53      1e54     regions
#   14   1e65       3.6e68      1e69     orbital energy, full safety branch
#   18   1e90       3.6e93      1e94     AGI race (first stage costs 1e95)
#
# Day-1 systems keep explicit numbers (DECISIONS item 13): infrastructure at lifetime 1e7,
# prestige layer 1 at run revenue 1e12 and only after infrastructure. Events and cards are
# day-1 systems without a number in DESIGN; they unlock together with infrastructure (1e7)
# so the first ~25 minutes stay focused on businesses (DESIGN 1, "gradual complexity").
# Time-based mechanics (model deflation, PPA days, investor quarter, hype half-life) still
# run on the game clock (state.clock_s).
# ------------------------------------------------------------------------------------------

[meta]
version = 2
target_days = 30

# ---------------------------------------------------------------- engine and performance
[engine]
sim_step_ms = 100
fps_animation = 30
fps_normal = 10
fps_background = 1
offline_step_s = 60
autosave_s = 60
backups = 3
undo_window_s = 5

[offline]
