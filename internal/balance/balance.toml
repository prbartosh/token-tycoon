final_benchmark = 100          # benchmark of the model it releases
si_every_oom = 10              # after the ending: a Superintelligence level every 10 orders of magnitude of lifetime revenue
si_bonus_per_level = 1.0       # revenue x (1 + level * bonus)
si_max_levels = 16

