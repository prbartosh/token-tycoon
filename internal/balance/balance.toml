# effect (value):
#   compute_mult (x)        compute per business unit        energy_cost (x)      energy cost share
#   max_params_mult (x)     maximum model size N             gpu_gen (gen)        GPU generation with research = true
#   enterprise_alloc (+)    Enterprise segment cap           contract_slots (+)   active contracts
#   contract_reward (+)     contract reward share            max_models (+)       models kept at once
#   rule_slots (+)          policy slots                     auto_prestige (1)    automatic layer 1 prestige
