quality_clamp = [0.5, 2.0]
quality_divisor = 50
deflation_per_day = 0.95
hype_half_life_h = 6
rival_span_days = 28           # rival benchmarks move from start_benchmark (day 1) to end_benchmark (this day)
base_benchmark = 12            # floor for the product before the first trained model; the wrapper follows the rival median
release_hype = 0.5             # hype added by a model release, times its quality premium
pressure_floor = 0.5           # lowest combined price pressure from open-weights releases

[market.segments]
free_price = 0.0
free_hype_per_share = 0.5     # hype gained per hour at 100% Free allocation and 100% market share
pro_price = 1.0
enterprise_price = 3.0
enterprise_min_benchmark = 70
enterprise_max_alloc = 0.3     # Enterprise buyers absorb at most this share of the token volume

[[rival]]
id = "northwind"
style = "steady"
release_every_days = 3
release_jitter_days = 0
start_benchmark = 12
end_benchmark = 95
price_pressure = 1.0

[[rival]]
id = "openweights"
style = "open_source"
release_every_days = 2
release_jitter_days = 0
start_benchmark = 8
end_benchmark = 90
price_pressure = 0.95          # every release lowers the market price

[[rival]]
id = "dragonfly"
style = "jumpy"
release_every_days = 3.5
release_jitter_days = 1.7      # random +-, below half the interval so releases stay in order
start_benchmark = 6
end_benchmark = 93
price_pressure = 1.0

[[rival]]
id = "haven"
style = "safety"
release_every_days = 4
release_jitter_days = 0
start_benchmark = 10
end_benchmark = 88
price_pressure = 1.0

# Regions (DESIGN 8.3). Before regions unlock the player sells to the home market only.
# Afterwards revenue is multiplied by (share of entered regions) / (share of entry = "none"
# regions), so the unlock itself changes nothing and every region entered adds demand.
# entry: none | compliance (AI Act, one-time cost) | datacenter (local data center building)
# entry_cost_minutes and enterprise_cost_minutes are minutes of the best income ever reached.
# The Enterprise segment sells only in entered regions with enterprise compliance; elsewhere
# its tokens sell at the Pro price.
[[region]]
id = "us"
market_share = 0.4
entry = "none"
entry_cost_minutes = 0
enterprise_cost_minutes = 0

[[region]]
id = "eu"
market_share = 0.3
entry = "compliance"
entry_cost_minutes = 120
enterprise_cost_minutes = 60

[[region]]
id = "asia"
market_share = 0.3
entry = "datacenter"
entry_cost_minutes = 180
enterprise_cost_minutes = 60

