# ---------------------------------------------------------------- milestones
# speed: each threshold reached multiplies the cycle time by speed_mult.
# profit: from profit_start, then every profit_every units forever, revenue * profit_mult.
# global: when ALL businesses own >= threshold; thresholds from global_thresholds, then
#         every global_every after the last one, forever (DECISIONS item 12).
[milestones]
speed_thresholds = [25, 50, 100]
speed_mult = 0.5
profit_start = 200
profit_every = 100
profit_mult = 2.0
global_thresholds = [25, 50, 100]
global_every = 100
global_mult = 2.0

