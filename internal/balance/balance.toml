# ---------------------------------------------------------------- rules (automation)
[rules]
unlock_lifetime = 1e44         # was unlock_day = 8
slots_start = 3
slots_max = 12
eval_every_s = 1

# ---------------------------------------------------------------- interface
[ui]
number_suffixes = ["", "K", "M", "B", "T"]
letter_suffixes_after = "T"    # then aa, ab, ac...
advisor_default = true
min_width = 60
two_panel_width = 80
three_panel_width = 120
sparkline_seconds = 60

