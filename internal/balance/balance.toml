param_divisor = 1e12
param_exponent = 0.5
bonus_per_param = 0.02
versions = ["v1.0", "v2.0", "v2.5 Turbo", "v3.0 Pro", "v3.5", "v4.0 Ultra", "v4.5 Turbo", "v5.0"]

[prestige.layer2]
